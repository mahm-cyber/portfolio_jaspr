name: Deploy Jaspr to GitHub Pages

on:
  push:
    branches: [ main ] # أو master لو كنت بتستخدمه
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
      - name: Install Jaspr CLI
        run: dart pub global activate jaspr_cli
      - name: Install Dependencies
        working-directory: ./jaspr_portfolio
        run: flutter pub get
      - name: Build Jaspr Site
        working-directory: ./jaspr_portfolio
        # غير 'portfolio_jaspr' لاسم الـ Repository بتاعك لو مختلف 
        # الخطوة دي مهمة جداً عشان ملفات الـ css والـ images تشتغل معاك ومتعملش 404 برضه
        run: jaspr build -v --dart-define=BASE_HREF="/portfolio_jaspr/"
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './jaspr_portfolio/build/jaspr'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
