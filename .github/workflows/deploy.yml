name: Deploy Jaspr to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jaspr_portfolio

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Jaspr
        run: dart pub global activate jaspr_cli

      - name: Install Dependencies
        run: dart pub get

      - name: Build Project
        run: |
          jaspr build --base-href /portfolio_jaspr/ --verbose
          touch build/jaspr/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'jaspr_portfolio/build/jaspr'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
