name: Deploy Jaspr to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Jaspr
        run: dart pub global activate jaspr_cli

      - name: Install Dependencies
        run: dart pub get

      - name: Build Project
        # Adjust base-href if deploying to a project page (e.g. /repo-name/)
        # For a user page (username.github.io), remove the --base-href flag or set to /
        run: jaspr build --verbose

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/jaspr'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
